  A memory-efficient rule-based candidate ranker that streams profiles sequentially.
  Evaluates 6 stages of scoring including expert skills, career trajectory, location/education tiers,
  and behavioral activity metrics combined with multiplicative hard disqualifiers. Runs on 100K in under 30 seconds.

declarations:
